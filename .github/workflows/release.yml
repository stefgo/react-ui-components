name: Release

on:
  push:
    branches:
      - main
      - dev

# Zwei Laeufe gleichzeitig wuerden denselben letzten Tag lesen und daraus
# dieselbe naechste Version berechnen. Nicht abbrechen: ein Release, das nach
# dem Publish stirbt, laesst Tag und Commit hinterher.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  checks:
    uses: ./.github/workflows/ci.yml

  release:
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      contents: write # Tag, Release, Commit von CHANGELOG/package.json
      packages: write # Publish an GitHub Packages
      issues: write # @semantic-release/github kommentiert Issues …
      pull-requests: write # … und PRs beim Release
    steps:
      - uses: actions/checkout@v4
        with:
          # semantic-release braucht die volle Historie und alle Tags, um den
          # letzten Release zu finden. persist-credentials: false, weil das
          # git-Plugin das Remote selbst mit GITHUB_TOKEN setzt.
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          registry-url: "https://npm.pkg.github.com"

      # Siehe ci.yml: npm 10 und npm 11 schreiben nicht dasselbe Lockfile.
      - name: Pin npm
        run: npm i -g "npm@$(node -p "require('./package.json').packageManager.split('@')[1]")"

      - name: Install dependencies
        run: npm ci

      # Kein eigener Build-Schritt: prepublishOnly baut beim npm publish, und
      # der checks-Job hat den Build bereits als Pruefung gefahren.
      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx semantic-release
